services:
  rustdesk-console:
    build:
      context: ./backend
    image: ghcr.io/globalpac/remote-console:latest
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DB_TYPE: sqlite
    volumes:
      - ./data:/data

  rustdesk-console-web:
    build:
      context: ./web
      dockerfile: Dockerfile.build
    image: ghcr.io/globalpac/remote-console-web:latest
    ports:
      - "21114:80"
    environment:
      BACKEND_URL: http://rustdesk-console:3000
    depends_on:
      - rustdesk-console
    restart: unless-stopped
